spring.application.name=RMA Web Application

# ==============================
# DataSource Configuration
# ==============================
spring.datasource.url=jdbc:mysql://localhost:3306/rmawebdb?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ==============================
# JPA & Hibernate
# ==============================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

# ==============================
# JWT Configuration (optional if set in code)
# ==============================
# jwt.secret=eW91cl9zZWNyZXRfa2V5
# jwt.expiration=3600000

# ==============================
# Logging Configuration
# ==============================
# Show general application logs
logging.level.com.mit.rma_web_application=DEBUG

# Show WebSocket connection & STOMP frame logs
logging.level.org.springframework.messaging=DEBUG
logging.level.org.springframework.web.socket=DEBUG

# If using STOMP/WebSocket interceptors or channels
logging.level.org.springframework.web.socket.messaging=DEBUG
logging.level.org.springframework.messaging.simp.stomp=DEBUG

# Hibernate SQL bind parameter values
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

# ==============================
# Server (Optional)
# ==============================
server.error.include-message=always
server.error.include-binding-errors=always
server.error.include-stacktrace=always
